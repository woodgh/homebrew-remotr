name: Update Remotr Cask

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh stable version and checksum
        run: python3 scripts/update_cask.py
      - name: Commit updated cask
        run: |
          if git diff --quiet -- Casks/remotr.rb; then
            echo "Cask is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/remotr.rb
          git commit -m "Update Remotr to $(sed -n 's/  version "\([^"]*\)"/\1/p' Casks/remotr.rb)"
          git push
